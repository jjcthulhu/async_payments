<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
    <title>Processar Transação</title>
</head>
<body>
<div class="container mt-5">
    <h2>Processar Transação <span th:text="${transacao.id}"></span></h2>
    
    <div class="card mt-4">
        <div class="card-body">
            <p><strong>Valor:</strong> R$ <span th:text="${transacao.amount}"></span></p>
            <p><strong>Método:</strong> <span th:text="${transacao.paymentMethod}"></span></p>
            <p><strong>Conexão:</strong> <span th:text="${transacao.connectionType}"></span></p>
            
            <form th:action="@{/intermediario/transacoes/processar/{id}(id=${transacao.id})}" 
                  method="post" class="mt-3">
                <div class="mb-3">
                    <label class="form-label">Status:</label>
                    <select name="status" class="form-select" required>
                        <option value="APROVADA">Aprovar</option>
                        <option value="REJEITADA">Rejeitar</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Confirmar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
