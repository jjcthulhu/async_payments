<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pagamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Realizar Pagamento</h2>
    
    <!-- Mensagens -->
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    
    <form th:object="${transactionForm}" th:action="@{/pagador/pagar}" method="post">
        <!-- Campo Valor -->
        <div class="mb-3">
            <label for="amount" class="form-label">Valor (R$)</label>
            <input type="number" step="0.01" class="form-control" 
                   id="amount" th:field="*{amount}" required>
            <small class="text-danger" th:if="${#fields.hasErrors('amount')}" 
                   th:errors="*{amount}"></small>
        </div>
        
        <!-- Campo Método de Pagamento -->
        <div class="mb-3">
            <label for="paymentMethod" class="form-label">Método de Pagamento</label>
            <select class="form-select" id="paymentMethod" th:field="*{paymentMethod}" required>
                <option value="">Selecione...</option>
                <option value="STRIPE">Stripe</option>
                <option value="PAGARME">Pagar.me</option>
                <option value="MERCADOPAGO">Mercado Pago</option>
            </select>
            <small class="text-danger" th:if="${#fields.hasErrors('paymentMethod')}" 
                   th:errors="*{paymentMethod}"></small>
        </div>
        
        
        <div class="mb-3">
    		<label for="recebedorId" class="form-label">ID do Recebedor</label>
    		<input type="text" class="form-control" 
        	   id="recebedorId" name="recebedorId" required>
		</div>
		<div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
		<div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
        
        <!-- Campo Tipo de Conexão -->
        <div class="mb-3">
            <label for="connectionType" class="form-label">Tipo de Conexão</label>
            <select class="form-select" id="connectionType" th:field="*{connectionType}" required>
                <option value="">Selecione...</option>
                <option value="INTERNET">Internet</option>
                <option value="SMS">SMS</option>
                <option value="BLUETOOTH">Bluetooth</option>
            </select>
            <small class="text-danger" th:if="${#fields.hasErrors('connectionType')}" 
                   th:errors="*{connectionType}"></small>
        </div>
        
        <button type="submit" class="btn btn-primary">Realizar Pagamento</button>
    </form>
</div>
</body>
</html>
