<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Área do Pagador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Realizar Pagamento</h1>
    
    <!-- Mensagem de sucesso -->
    <div th:if="${mensagemSucesso}" class="alert alert-success">
        <span th:text="${mensagemSucesso}"></span>
    </div>
    
    <!-- Formulário de pagamento -->
    <form th:action="@{/pagador/pagar}" method="post" class="border p-4 rounded">
        <div class="mb-3">
            <label for="amount" class="form-label">Valor (R$)</label>
            <input type="number" step="0.01" class="form-control" 
                   id="amount" name="amount" required>
        </div>
        
        <div class="mb-3">
            <label for="paymentMethod" class="form-label">Método de Pagamento</label>
            <select class="form-select" id="paymentMethod" name="paymentMethod" required>
                <option value="">Selecione...</option>
                <option value="STRIPE">Stripe</option>
                <option value="PAGARME">Pagar.me</option>
                <option value="MERCADOPAGO">Mercado Pago</option>
            </select>
        </div>
        
        <div class="mb-3">
            <label for="connectionType" class="form-label">Tipo de Conexão</label>
            <select class="form-select" id="connectionType" name="connectionType" required>
                <option value="">Selecione...</option>
                <option value="INTERNET">Internet</option>
                <option value="SMS">SMS</option>
                <option value="BLUETOOTH">Bluetooth</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Enviar Pagamento</button>
    </form>
</div>
</body>
</html>
