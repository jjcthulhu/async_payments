<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transações Pendentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Transações Pendentes</h2>
    
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    
    <div th:if="${transacoes != null and !transacoes.empty}">
        <table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Pagador</th>
            <th>Saldo Pagador</th>
            <th>Recebedor</th>
            <th>Saldo Recebedor</th>
            <th>Valor</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="tx : ${transacoes}">
            <td th:text="${tx.id}"></td>
            <td th:text="${tx.pagadorId}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(saldos.get(tx.pagadorId), 1, 2)}"></td>
            <td th:text="${tx.recebedorId}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(saldos.get(tx.recebedorId), 1, 2)}"></td>
            <td th:text="'R$ ' + ${#numbers.formatDecimal(tx.amount, 1, 2)}"></td>
            <td>
                <!-- Botões de ação -->
            </td>
        </tr>
    </tbody>
	</table>
    </div>
    <div th:if="${transacoes == null or transacoes.empty}" class="alert alert-info">
        Nenhuma transação pendente encontrada.
    </div>
</div>
</body>
</html>
